apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: retail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: retail
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        # emptyDir means data is lost if the pod restarts — fine for a
        # local demo cluster you'll tear down anyway. For anything longer-
        # lived, swap this for a PersistentVolumeClaim.
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: retail
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
