services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,PLAINTEXT_HOST://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retail
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- App services below: containerized versions of what you've been
  # running with `sbt run` / `spark-submit` directly. Optional — the
  # bare-metal workflow from Part E still works fine and is faster to
  # iterate on. These are here for when you want to demo the whole thing
  # containerized, or as a stepping stone toward the Kubernetes part. ---

  order-generator:
    build: ./order-generator
    container_name: order-generator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Not started by a plain `docker compose up` — start explicitly with
    # `docker compose up -d --build order-generator` once the topic exists.
    profiles: ["app"]

  streaming-job:
    build: ./streaming-job
    container_name: streaming-job
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JDBC_URL: jdbc:postgresql://postgres:5432/retail
      JDBC_USER: postgres
      JDBC_PASSWORD: postgres
    profiles: ["app"]

  batch-job:
    build: ./batch-job
    container_name: batch-job
    depends_on:
      - postgres
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/retail
      JDBC_USER: postgres
      JDBC_PASSWORD: postgres
    # No "restart" policy and not part of the "app" profile's long-running
    # set — this one is meant to be run on demand, see README, not left up.
    profiles: ["batch"]

volumes:
  pgdata:
